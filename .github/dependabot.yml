version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      vite:
        patterns:
          - vite
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
      testing:
        patterns:
          - '@testing-library/*'
          - jsdom
      tooling:
        patterns:
          - typescript
          - oxlint
          - prettier
          - '@types/node'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Madrid
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'chore(actions)'
    groups:
      actions:
        patterns:
          - '*'
