name: Refresh lockfile

# Regenerates package-lock.json from the public npm registry and opens a pull
# request if anything changed.
#
# This exists because a lockfile records *where* each tarball came from. Running
# npm install behind a corporate registry mirror writes that mirror's hostnames
# into `resolved`, and its integrity hashes into `integrity`. Committing that to
# a public repository leaks internal infrastructure names and makes every clone
# pull from a feed most people cannot reach. Regenerating on a plain GitHub
# runner guarantees the lockfile only ever references registry.npmjs.org.

on:
  workflow_dispatch:
  schedule:
    # Monthly, so drift is caught even if nobody remembers this workflow exists.
    - cron: '17 4 1 * *'

permissions:
  contents: read

jobs:
  refresh:
    name: Regenerate and open a pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Regenerate the lockfile
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --no-audit --no-fund

      - name: Confirm it only references the public registry
        run: |
          if grep -oE '"resolved": "https://[^/]+' package-lock.json \
            | sort -u | grep -v 'registry.npmjs.org'; then
            echo "::error::The lockfile still references a non-public registry."
            exit 1
          fi
          echo "All resolved URLs point at registry.npmjs.org."

      - name: Verify the tree still installs and passes
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current. Nothing to do."
            exit 0
          fi

          BRANCH="chore/refresh-lockfile-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add package-lock.json
          git commit -m "chore: regenerate the lockfile from the public npm registry

          Generated by the Refresh lockfile workflow, run ${GITHUB_RUN_ID}."
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: regenerate the lockfile from the public npm registry" \
            --body "Regenerated by the \`Refresh lockfile\` workflow so that every \`resolved\` URL points at \`registry.npmjs.org\`. Lint, typecheck, tests and build all passed against the regenerated tree before this pull request was opened." \
            --label dependencies \
            --label ci
