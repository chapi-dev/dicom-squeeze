name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Runs before npm ci, because a lockfile pointing at somebody's corporate
      # registry mirror is a problem whether or not the install happens to work.
      - name: Check the lockfile only references the public registry
        run: |
          if grep -oE '"resolved": "https://[^/]+' package-lock.json \
            | sort -u | grep -v 'registry.npmjs.org'; then
            echo "::error file=package-lock.json::The lockfile references a registry other than registry.npmjs.org, which usually means npm install ran behind a corporate mirror. Do not hand-edit it: run the 'Refresh lockfile' workflow."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Node 20 reached end of life on 2026-04-30, and jsdom 30 fails on it
        # (undici's webidl.util.markAsUncloneable is missing). What remains is
        # every supported line: 22 maintenance LTS, 24 active LTS, 26 current.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Single required status check so branch protection does not need updating
  # every time a matrix entry is added or removed.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: always()
    steps:
      - name: Fail if any upstream job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All CI jobs passed."
